<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060a">
<meta name="format-detection" content="telephone=no">
<title>MUGEN CITY</title>
<style>
/* MUGEN CITY — page shell. Sizes itself from html/body height:100% (never 100vh) so it also
   works as a fragment inside an iframe host. */
html,body{height:100%;margin:0;padding:0;background:#05060a;color:#f3f5fa;overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
body{position:fixed;left:0;top:0;right:0;bottom:0;width:100%}
#app{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  overflow:hidden;container-type:size;
  background:radial-gradient(120% 90% at 50% 0%,#141a2c 0%,#090b14 55%,#05060a 100%)}
#game{position:relative;flex:none;width:100%;height:100%;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 30px 90px rgba(0,0,0,.65);
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
/* desktop / tablets in landscape: centred portrait frame, aspect clamped to 9:16 .. 9:19.5 */
@supports (width:1cqw){
  #game{width:min(100cqw,calc(100cqh * 9 / 16));height:min(100cqh,calc(100cqw * 19.5 / 9))}
}
/* touch devices held upright always use the whole screen */
@media (pointer:coarse) and (orientation:portrait){#game{width:100%;height:100%}}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:2}

/* ---- loading screen ---- */
#boot{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;opacity:1;transition:opacity .6s ease;
  padding:calc(var(--sat) + 24px) 24px calc(var(--sab) + 24px);box-sizing:border-box;
  background:
    radial-gradient(80% 45% at 50% 108%,rgba(255,79,163,.34) 0%,rgba(255,79,163,0) 70%),
    radial-gradient(90% 50% at 50% -10%,rgba(54,224,255,.26) 0%,rgba(54,224,255,0) 70%),
    linear-gradient(180deg,#0a0e1c 0%,#0b0a18 55%,#12081a 100%)}
#boot.done{opacity:0;pointer-events:none}
#boot .logo{font-weight:900;font-size:44px;line-height:1.02;letter-spacing:.14em;margin-right:-.14em;
  background:linear-gradient(92deg,#36e0ff 0%,#9c8cff 48%,#ff4fa3 100%);-webkit-background-clip:text;
  background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(54,224,255,.35))}
#boot .logo span{display:block}
#boot .kana{font-weight:700;font-size:15px;letter-spacing:.62em;margin-right:-.62em;color:#dfe6ff;opacity:.9}
#boot .tag{font-size:12px;letter-spacing:.2em;color:#8f99b3;margin-top:2px}
#boot .skyline{width:78%;max-width:320px;height:54px;margin-top:18px;opacity:.9}
#boot .bar{width:64%;max-width:260px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px}
#boot-bar{display:block;width:100%;height:100%;border-radius:3px;transform:scaleX(0);transform-origin:left center;
  background:linear-gradient(90deg,#36e0ff,#ff4fa3);transition:transform .25s ease}
#boot-status{min-height:18px;font-size:12px;color:#a3abbd;letter-spacing:.06em}
#boot .ver{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 14px);font-size:10px;color:#5d6578;letter-spacing:.12em}

/* ---- fatal error ---- */
#fatal{position:absolute;left:0;top:0;width:100%;height:100%;z-index:6;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;box-sizing:border-box;
  padding:calc(var(--sat) + 24px) 26px calc(var(--sab) + 24px);background:#0a0c14}
#fatal svg{color:#ff5468}
#fatal h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.04em}
#fatal p{margin:0;font-size:14px;line-height:1.6;color:#c3cadb}
#fatal pre{margin:0;max-width:100%;max-height:26%;overflow:auto;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;
  color:#7f8aa3;white-space:pre-wrap;word-break:break-all;text-align:left;-webkit-user-select:text;user-select:text}
#fatal button{margin-top:8px;min-height:44px;padding:0 22px;border-radius:12px;border:0;font:700 15px inherit;
  font-family:inherit;color:#04121a;background:linear-gradient(180deg,#3fe6ff,#1bb3e6);cursor:pointer}

/* ---- rotate hint (phones in landscape) ---- */
#rotate{position:absolute;left:0;top:0;width:100%;height:100%;z-index:10;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:#05060a;color:#f3f5fa;text-align:center}
#rotate svg{color:#36e0ff;animation:mgRot 2.4s ease-in-out infinite}
#rotate p{margin:0;font-size:17px;font-weight:800;letter-spacing:.08em}
@keyframes mgRot{0%,20%{transform:rotate(-90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse) and (hover:none) and (max-height:540px){#rotate{display:flex}}
#app[data-rotate="1"] #rotate{display:flex}
#app[data-rotate="0"] #rotate{display:none}
</style>
</head>
<body>
<!--BODY-->
<div id="app">
  <div id="game">
    <canvas id="canvas" tabindex="-1" aria-label="MUGEN CITY"></canvas>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="logo"><span>MUGEN</span><span>CITY</span></div>
      <div class="kana">ムゲンシティ</div>
      <div class="tag">無限島へようこそ</div>
      <svg class="skyline" viewBox="0 0 320 54" fill="none" aria-hidden="true">
        <defs><linearGradient id="bootSky" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#36e0ff"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient></defs>
        <path d="M0 53h18V34h14v19h10V22h18v31h8V30h12v23h10V12h8V4h6v8h8v41h10V26h16v27h8V36h12v17h10V18h20v35h8V30h14v23h10V40h12v13h10V24h16v29h12" stroke="url(#bootSky)" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <div class="bar"><i id="boot-bar"></i></div>
      <div id="boot-status">読み込み中</div>
      <div class="ver">MUGEN CITY</div>
    </div>
    <div id="fatal" role="alert">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.3v.2"/></svg>
      <h1 id="fatal-title">このブラウザではプレイできません</h1>
      <p id="fatal-text">WebGL2 と WebAssembly に対応したブラウザが必要です。</p>
      <pre id="fatal-detail"></pre>
      <button id="fatal-reload" type="button">再読み込み</button>
    </div>
  </div>
  <div id="rotate" role="alert">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M10.8 18.5h2.4"/></svg>
    <p>画面を縦にしてください</p>
  </div>
</div>
<noscript><p style="position:fixed;left:0;right:0;top:40%;text-align:center;color:#fff;font-family:sans-serif">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
<!--/BODY-->
<script>/*__BUNDLE__*/</script>
</body>
</html>
